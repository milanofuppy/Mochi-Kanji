<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Mochi Kanji: impara kanji, hiragana e katakana giocando.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Mochi Kanji</title>
<meta name="apple-mobile-web-app-title" content="Mochi Kanji">
<meta name="application-name" content="Mochi Kanji">
<meta name="theme-color" content="#cfeafb">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* Layout: un mondo di nuvole pastello. Schede bianche "adesivo" su cielo azzurro, accenti beige, mascotte Mochi. Un solo tema chiaro, scelto apposta. */
:root{
  color-scheme:light;
  --sky:#cfeafb; --sky-mid:#a9d8f3; --sky-deep:#6fb9e3; --sky-ink:#3f7aa6;
  --cloud:#f7fbff; --white:#ffffff; --edge:#e1f0fa; --shadow:#cfe6f6;
  --beige:#f4ead9; --beige-mid:#e9d6b6; --beige-deep:#c9a978;
  --ink:#4a5a72; --ink-soft:#8796ab; --blush:#f7c6c7;
  --ok:#55bf9b; --bad:#ec8ca0; --gold:#e5ad55;
  --f-title:"Mochiy Pop One","Zen Maru Gothic",system-ui,sans-serif;
  --f-ui:"Zen Maru Gothic","Hiragino Maru Gothic ProN",system-ui,sans-serif;
  --f-kanji:"Klee One","Hiragino Mincho ProN","Yu Mincho",serif;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background-color:var(--cloud);background-image:linear-gradient(180deg,var(--sky) 0,var(--cloud) 520px);background-repeat:no-repeat;color:var(--ink);font-family:var(--f-ui);font-weight:500;font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 48px;overflow-x:hidden}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:14px;position:relative;z-index:1}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--sky-deep);outline-offset:3px;border-radius:12px}
.jp{font-family:var(--f-kanji)}
.ro{display:block;font-family:var(--f-ui);font-size:.62em;font-weight:700;color:var(--sky-ink);letter-spacing:.03em;line-height:1.2}
.ro-in{font-family:var(--f-ui);font-size:.8em;font-weight:700;color:var(--sky-ink)}

/* nuvole di sfondo */
.sky-deco{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.cl{position:absolute;background:var(--white);border-radius:999px;opacity:.8;animation:drift linear infinite}
.cl::before,.cl::after{content:"";position:absolute;background:inherit;border-radius:50%}
.cl::before{width:55%;height:150%;left:15%;bottom:20%}
.cl::after{width:40%;height:120%;right:12%;bottom:25%}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}

/* header */
header.top{display:flex;align-items:center;gap:10px}
.back{display:flex;align-items:center;gap:6px;font-weight:700;color:var(--sky-ink);background:var(--white);border-radius:999px;padding:7px 14px 7px 10px;box-shadow:0 3px 0 var(--shadow)}
.top .sp{flex:1}
.lvchip{background:var(--white);border-radius:999px;padding:5px 12px;font-weight:700;font-size:13px;box-shadow:0 3px 0 var(--shadow);display:flex;align-items:center;gap:8px;white-space:nowrap;font-variant-numeric:tabular-nums}
.lvchip .bar{width:48px;height:6px;border-radius:4px;background:var(--edge);overflow:hidden}
.lvchip .bar i{display:block;height:100%;background:var(--gold);transition:width .4s}
.iconbtn{width:42px;height:42px;border-radius:50%;background:var(--white);display:grid;place-items:center;box-shadow:0 3px 0 var(--shadow);color:var(--sky-ink);flex:none}
.iconbtn svg{width:22px;height:22px}
.iconbtn.on{background:var(--sky-deep);color:var(--white);box-shadow:0 3px 0 var(--sky-ink)}

/* elementi comuni */
.card{background:var(--white);border-radius:24px;padding:18px;box-shadow:0 6px 0 var(--shadow);border:2px solid var(--edge)}
h2{font-family:var(--f-title);font-weight:400;font-size:20px;margin:0;color:var(--ink);text-wrap:balance}
.muted{color:var(--ink-soft);font-size:13px}
.label{font-size:12px;letter-spacing:.06em;color:var(--sky-ink);font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{background:var(--sky-deep);color:var(--white);border-radius:999px;padding:12px 22px;font-weight:900;font-size:15px;box-shadow:0 4px 0 var(--sky-ink);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--sky-ink)}
.btn.soft{background:var(--beige);color:var(--ink);box-shadow:0 4px 0 var(--beige-mid)}
.btn.soft:active{box-shadow:0 1px 0 var(--beige-mid)}
.btn.white{background:var(--white);color:var(--sky-ink);box-shadow:0 4px 0 var(--shadow);border:2px solid var(--edge)}
.btn.ok{background:var(--ok);box-shadow:0 4px 0 #3d9a7a}
.btn.small{padding:8px 14px;font-size:13px}
.link{color:var(--sky-ink);font-weight:700;font-size:13px;text-decoration:underline;text-underline-offset:3px}

/* title screen */
.title-screen{min-height:calc(100svh - 60px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding-block:20px}
.title-screen .mascot{width:min(62vw,240px);animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px) rotate(-2deg)}}
.logo{font-family:var(--f-title);font-size:clamp(30px,8vw,46px);line-height:1.15;color:var(--ink);margin:0;text-wrap:balance}
.logo .m1,.logo .m2{display:inline-block;text-shadow:0 4px 0 var(--white),0 -2px 0 var(--white),3px 0 0 var(--white),-3px 0 0 var(--white),0 8px 0 var(--shadow)}
.logo .m1{color:var(--sky-deep);transform:rotate(-4deg);margin-right:.25em}
.logo .m2{color:var(--beige-deep);transform:rotate(3deg) translateY(4px)}
.logo small{display:block;font-family:var(--f-kanji);font-size:.48em;color:var(--sky-ink);font-weight:600;letter-spacing:.12em;margin-top:6px}
.title-actions{display:flex;flex-direction:column;align-items:center;gap:14px}
.title-actions .btn{font-size:20px;padding:16px 46px}
.sound-big{display:flex;align-items:center;gap:10px;background:var(--white);border-radius:999px;padding:8px 18px 8px 8px;box-shadow:0 4px 0 var(--shadow);font-weight:700;color:var(--sky-ink)}
.sound-big .ic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--edge);transition:background .2s}
.sound-big .ic svg{width:22px;height:22px}
.sound-big.on .ic{background:var(--sky-deep);color:var(--white)}
.notes{display:inline-flex;gap:2px;align-items:flex-end;height:14px}
.notes i{width:3px;background:var(--sky-deep);border-radius:2px;height:4px}
.sound-big.on .notes i{animation:eq 1s ease-in-out infinite}
.notes i:nth-child(2){animation-delay:.2s!important}.notes i:nth-child(3){animation-delay:.4s!important}
@keyframes eq{50%{height:14px}}

/* menu */
.hello{display:flex;align-items:center;gap:14px}
.hello .mascot{width:86px;flex:none}
.bubble{background:var(--white);border-radius:20px;padding:12px 16px;box-shadow:0 4px 0 var(--shadow);position:relative;flex:1;min-width:0}
.bubble::before{content:"";position:absolute;left:-9px;top:24px;border:10px solid transparent;border-right-color:var(--white);border-left:0}
.bubble b{font-family:var(--f-title);font-weight:400;font-size:17px;display:block}
.section-title{font-family:var(--f-title);font-size:15px;color:var(--sky-ink);margin:6px 4px -4px;display:flex;align-items:center;gap:8px}
.section-title::after{content:"";flex:1;height:2px;border-radius:2px;background:var(--edge)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:440px){.modes{grid-template-columns:1fr}}
.mode{text-align:left;background:var(--white);border-radius:22px;padding:14px;display:flex;gap:14px;align-items:center;box-shadow:0 5px 0 var(--shadow);border:2px solid var(--edge);transition:transform .12s}
.mode:hover{transform:translateY(-3px)}
.mode:active{transform:translateY(2px)}
.mode .big{font-family:var(--f-kanji);font-weight:600;font-size:34px;line-height:1;width:60px;height:60px;display:grid;place-items:center;border-radius:18px;background:var(--sky);color:var(--sky-ink);flex:none}
.mode.beige .big{background:var(--beige);color:var(--beige-deep)}
.mode strong{display:block;font-family:var(--f-title);font-weight:400;font-size:16px}
.mode span span{font-size:13px;color:var(--ink-soft);display:block;line-height:1.4}

.groups{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{border-radius:14px;padding:5px 10px;font-size:13px;background:var(--cloud);border:2px solid var(--edge);display:flex;flex-direction:column;align-items:center;line-height:1.25;min-width:58px;font-weight:700}
.chip .jp{font-size:16px;letter-spacing:.05em}
.chip small{font-size:10px;color:var(--ink-soft)}
.chip[aria-pressed="true"]{background:var(--sky-deep);border-color:var(--sky-deep);color:var(--white)}
.chip[aria-pressed="true"] small{color:var(--white)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--cloud);border-radius:999px;padding:4px;border:2px solid var(--edge)}
.seg button{border-radius:999px;padding:8px 4px;font-weight:700;font-size:14px;color:var(--ink-soft)}
.seg button[aria-pressed="true"]{background:var(--white);color:var(--sky-ink);box-shadow:0 2px 0 var(--shadow)}
.progress{height:10px;background:var(--edge);border-radius:6px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--sky-deep);border-radius:6px;transition:width .3s}
.progress.gold i{background:var(--gold)}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.stat{background:var(--cloud);border-radius:16px;padding:8px;text-align:center}
.stat b{display:block;font-family:var(--f-title);font-weight:400;font-size:20px;color:var(--sky-ink);font-variant-numeric:tabular-nums}
.stat small{font-size:11px;color:var(--ink-soft);font-weight:700}

/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700;font-variant-numeric:tabular-nums}
.hearts{display:flex;gap:3px}
.hearts svg{width:22px;height:22px}
.prompt{text-align:center;padding:10px 0 2px}
.prompt .ask{font-size:14px;color:var(--ink-soft);font-weight:700}
.kbig{font-family:var(--f-kanji);font-size:min(28vw,118px);line-height:1.15;font-weight:600;display:inline-block;padding:4px 20px;margin:10px 0;color:var(--ink);
  background:var(--cloud);border-radius:28px;border:3px dashed var(--sky-mid)}
.kword{font-family:var(--f-kanji);font-size:min(13vw,60px);font-weight:600;margin:12px 0 4px;line-height:1.2}
.prompt .it{font-family:var(--f-title);font-size:24px;margin:16px 0 6px;color:var(--sky-ink)}
.prompt .hint{font-size:15px;color:var(--ink-soft)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.opt{border-radius:18px;padding:12px 8px;font-weight:700;font-size:15px;min-height:64px;background:var(--cloud);border:2px solid var(--edge);box-shadow:0 4px 0 var(--edge);transition:transform .08s}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.opt.kanji{font-family:var(--f-kanji);font-size:38px;font-weight:600;padding:4px}
.opt.kana{font-family:var(--f-kanji);font-size:21px}
.opt.kana .ro{font-size:12px}
.opt.ok{background:#e3f6ee;border-color:var(--ok);box-shadow:0 4px 0 var(--ok);animation:pop .35s}
.opt.no{background:#fdecef;border-color:var(--bad);box-shadow:0 4px 0 var(--bad);animation:shake .35s}
.opt:disabled{cursor:default}
@keyframes pop{40%{transform:scale(1.07)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.combo{text-align:center;font-family:var(--f-title);color:var(--gold);min-height:24px;font-size:16px}
.feedback{margin-top:14px;background:var(--cloud);border-radius:18px;padding:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.feedback .fk{font-family:var(--f-kanji);font-size:50px;line-height:1;font-weight:600;width:68px;text-align:center}
.feedback .txt{flex:1;min-width:150px}
.verdict{font-family:var(--f-title);font-size:16px}
.verdict.ok{color:var(--ok)} .verdict.no{color:var(--bad)}
.timer{font-family:var(--f-title);font-size:24px;color:var(--sky-ink)}
.timer.low{color:var(--bad)}

/* risultato */
.result{text-align:center}
.result .mascot{width:120px;margin:0 auto}
.stamp{display:inline-grid;place-items:center;width:124px;height:124px;border:5px double var(--bad);border-radius:50%;color:var(--bad);font-family:var(--f-kanji);font-size:38px;font-weight:600;transform:rotate(-12deg);margin:6px auto;animation:stamp .5s cubic-bezier(.2,1.6,.4,1) both;background:#fff6f8}
.stamp.retry{border-color:var(--sky-deep);color:var(--sky-ink);background:var(--cloud);font-size:24px;border-radius:30px;width:auto;padding:0 18px;height:80px}
@keyframes stamp{from{transform:rotate(-12deg) scale(2.3);opacity:0}to{transform:rotate(-12deg) scale(1);opacity:1}}
.bigscore{font-family:var(--f-title);font-size:36px;color:var(--sky-ink);font-variant-numeric:tabular-nums}
.missed{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0}
.missed span{font-family:var(--f-kanji);font-size:26px;font-weight:600;background:#fdecef;border-radius:12px;width:48px;height:48px;display:grid;place-items:center}

/* scrittura */
.wprompt{display:flex;flex-direction:column;gap:2px;text-align:center}
.wprompt .it{font-family:var(--f-title);font-size:24px;color:var(--sky-ink)}
.wprompt .rd{font-family:var(--f-kanji);font-size:16px}
.pad{position:relative;width:min(100%,330px);aspect-ratio:1;margin:12px auto 0;border-radius:24px;background:var(--white);border:3px solid var(--sky-mid);touch-action:none;max-width:100%;overflow:hidden;
  background-image:radial-gradient(circle,var(--edge) 1.5px,transparent 1.6px);background-size:22px 22px}
.pad::before,.pad::after{content:"";position:absolute;pointer-events:none}
.pad::before{left:50%;top:8%;bottom:8%;border-left:2px dashed var(--sky)}
.pad::after{top:50%;left:8%;right:8%;border-top:2px dashed var(--sky)}
.pad .ghost{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-kanji);font-size:min(66vw,250px);line-height:1;color:var(--sky-deep);opacity:.2;pointer-events:none;user-select:none}
.pad .ghost.check{opacity:1;color:transparent;-webkit-text-stroke:2.5px var(--bad)}
.pad canvas{position:absolute;inset:0;width:100%;height:100%;z-index:1}
.wtools{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.toggle[aria-pressed="true"]{background:var(--sky);color:var(--sky-ink)}
details summary{cursor:pointer;list-style:none}
details summary::-webkit-details-marker{display:none}

/* studia */
.search{width:100%;padding:12px 16px;border-radius:999px;border:2px solid var(--edge);background:var(--cloud);color:var(--ink);font:inherit}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;margin-top:12px}
.kcell{aspect-ratio:1;border-radius:18px;background:var(--cloud);border:2px solid var(--edge);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.kcell .jp{font-size:30px;line-height:1;font-weight:600}
.kcell.kana .jp{font-size:28px}
.kcell .r{font-size:11px;font-weight:700;color:var(--sky-ink);line-height:1}
.dots{display:flex;gap:2px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--edge)}
.dots i.on{background:var(--gold)}
.ktable{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.ktable .rowlab{grid-column:1/-1;font-size:11px;font-weight:700;color:var(--ink-soft);margin-top:6px}
.ktable .empty{visibility:hidden}

.overlay{position:fixed;inset:0;background:rgba(74,90,114,.35);z-index:50;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
.sheet{background:var(--white);width:100%;max-width:560px;max-height:90%;overflow:auto;border-radius:28px 28px 0 0;
  padding:20px max(18px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.dhead{display:flex;gap:16px;align-items:center}
.dhead .jp{font-size:84px;line-height:1;font-weight:600;background:var(--cloud);border:3px dashed var(--sky-mid);border-radius:24px;padding:6px 12px}
.dhead .mean{font-family:var(--f-title);font-size:20px;color:var(--sky-ink)}
.rd-grid{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:14px 0;font-size:14px}
.rd-grid dd{margin:0;font-family:var(--f-kanji);font-size:18px}
.rd-grid dt{color:var(--ink-soft);font-weight:700;font-size:12px;padding-top:4px}
.words{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.words li{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr) auto;gap:2px 12px;padding:10px 12px;border-radius:16px;background:var(--cloud);align-items:center}
.words .w{font-family:var(--f-kanji);font-size:21px;font-weight:600}
.words .r{font-family:var(--f-kanji);font-size:15px}
.words .m{grid-column:1/-1;font-size:14px;color:var(--ink-soft)}
.say{background:var(--white);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;color:var(--sky-ink);box-shadow:0 2px 0 var(--shadow)}

.shot img{width:100%;border-radius:18px;display:block;box-shadow:0 6px 0 var(--shadow)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--white);padding:10px 18px;border-radius:999px;font-weight:700;z-index:80;animation:up .25s;max-width:calc(100% - 32px);text-align:center}
.spark{position:fixed;z-index:90;pointer-events:none;color:var(--gold);font-size:18px;animation:spark .7s ease-out forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.3) rotate(120deg);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<div class="sky-deco" aria-hidden="true" id="deco"></div>
<div class="wrap">
  <header class="top" id="hdr" hidden>
    <button class="back" id="backBtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg><span id="backLbl">Menu</span></button>
    <span class="sp"></span>
    <span class="lvchip">Lv <span id="lv">1</span><span class="bar"><i id="lvfill"></i></span></span>
    <button class="iconbtn" id="camBtn" aria-label="Crea immagine dei progressi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
    <button class="iconbtn snd" id="sndBtn" aria-label="Musica"></button>
  </header>
  <main id="view"></main>
</div>
<div id="layer"></div>

<script>
const RAW=`日|ニチ・ジツ|ひ・か|giorno; sole|～日=～にち=giorno (nelle date);日本人=にほんじん=giapponese (persona);日本語=にほんご=lingua giapponese;日曜日=にちようび=domenica
一|イチ・イツ|ひと(つ)|uno|一日=いちにち=un giorno intero;一日=ついたち=il primo del mese;一つ=ひとつ=uno (oggetto);一人=ひとり=una persona
百|ヒャク|—|cento|百=ひゃく=cento;二百=にひゃく=duecento;三百=さんびゃく=trecento;六百=ろっぴゃく=seicento;八百=はっぴゃく=ottocento

const GSIZE=12;
const K=RAW.trim().split("\n").map((line,i)=>{const [k,on,kun,mean,ws]=line.split("|");
  return {k,on,kun,mean,i,g:Math.floor(i/GSIZE),words:ws.split(";").map(w=>{const [w0,r,m]=w.split("=");return {w:w0,r,m}})}});
const NG=Math.ceil(K.length/GSIZE);
const ALLW=K.flatMap(x=>x.words.map(w=>({...w,k:x.k})));

const KROWS=[
 ["a","あいうえお","a i u e o"],["ka","かきくけこ","ka ki ku ke ko"],["sa","さしすせそ","sa shi su se so"],["ta","たちつてと","ta chi tsu te to"],
 ["na","なにぬねの","na ni nu ne no"],["ha","はひふへほ","ha hi fu he ho"],["ma","まみむめも","ma mi mu me mo"],["ya","や_ゆ_よ","ya _ yu _ yo"],
 ["ra","らりるれろ","ra ri ru re ro"],["wa","わ___を","wa _ _ _ wo"],["n","ん____","n _ _ _ _"],
 ["ga","がぎぐげご","ga gi gu ge go"],["za","ざじずぜぞ","za ji zu ze zo"],["da","だぢづでど","da ji zu de do"],["ba","ばびぶべぼ","ba bi bu be bo"],["pa","ぱぴぷぺぽ","pa pi pu pe po"]];
const BASIC_ROWS=KROWS.slice(0,11).map(r=>r[0]);
const toKata=s=>s.replace(/[ぁ-ゖ]/g,c=>String.fromCharCode(c.charCodeAt(0)+0x60));
const toHira=s=>s.replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
const KANA=[];
for(const [row,h,r] of KROWS){const rs=r.split(" ");[...h].forEach((c,j)=>{if(c==="_")return;KANA.push({c,r:rs[j],s:"h",row,id:"h"+c});KANA.push({c:toKata(c),r:rs[j],s:"k",row,id:"k"+c})})}

/* ---------- romaji ---------- */
const RT={};
(()=>{const base=KROWS.map(r=>[r[1],r[2].split(" ")]);for(const [h,rs] of base)[...h].forEach((c,j)=>{if(c!=="_")RT[c]=rs[j]});
  const yo={き:"ky",ぎ:"gy",し:"sh",じ:"j",ち:"ch",に:"ny",ひ:"hy",び:"by",ぴ:"py",み:"my",り:"ry"};
  for(const [c,p] of Object.entries(yo)){RT[c+"ゃ"]=p+"a";RT[c+"ゅ"]=p+"u";RT[c+"ょ"]=p+"o"}
  Object.assign(RT,{ぁ:"a",ぃ:"i",ぅ:"u",ぇ:"e",ぉ:"o",ゃ:"ya",ゅ:"yu",ょ:"yo",ゔ:"vu"})})();
function romaji(str){
  const s=toHira(str);let out="";
  for(let i=0;i<s.length;i++){
    const c=s[i];
    if(c==="っ"){const nx=RT[s.slice(i+1,i+3)]||RT[s[i+1]];if(nx)out+=(nx.startsWith("ch")?"t":nx[0]);continue}
    if(c==="ー"){out+=out.slice(-1);continue}
    if(c==="ん"){const nx=RT[s[i+1]];out+=(nx&&/^[aiueoy]/.test(nx))?"n'":"n";continue}
    if(RT[s.slice(i,i+2)]&&s.slice(i,i+2).length===2&&/[ゃゅょ]/.test(s[i+1])){out+=RT[s.slice(i,i+2)];i++;continue}
    if(RT[c]){out+=RT[c];continue}
    if(c==="・")out+=" / ";else if(c==="～")out+="~";else out+=c;
  }
  return out;
}
const hasKana=s=>/[ぁ-ヿ]/.test(s);
const rb=(kana,cls="")=>`<span class="${cls}">${esc(kana)}${hasKana(kana)?`<span class="ro">${esc(romaji(kana))}</span>`:""}</span>`;
const rin=kana=>hasKana(kana)?` <span class="ro-in">(${esc(romaji(kana))})</span>`:"";

let AC=null,master,musicBus,sfxBus,bgmTimer=null,nextT=0,step=0;
function audio(){
  if(AC)return AC;
  try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return null}
  master=AC.createGain();master.gain.value=.9;master.connect(AC.destination);
  // riverbero morbido
  const len=AC.sampleRate*2.6,ir=AC.createBuffer(2,len,AC.sampleRate);
  for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3)}
  const rev=AC.createConvolver();rev.buffer=ir;const revG=AC.createGain();revG.gain.value=.35;rev.connect(revG);revG.connect(master);
  musicBus=AC.createGain();musicBus.gain.value=0;musicBus.connect(master);musicBus.connect(rev);
  sfxBus=AC.createGain();sfxBus.gain.value=.28;sfxBus.connect(master);sfxBus.connect(rev);
  return AC;
}
const hz=semi=>349.23*Math.pow(2,semi/12); // da Fa4
function tone(bus,f,t,dur,{type="sine",vol=.2,att=.005,rel=null,detune=0}={}){
  const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;o.detune.value=detune;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+att);g.gain.exponentialRampToValueAtTime(.0001,t+(rel??dur));
  o.connect(g);g.connect(bus);o.start(t);o.stop(t+(rel??dur)+.05);
}
function musicBox(f,t,vol=.11){tone(musicBus,f,t,1.6,{vol});tone(musicBus,f*2,t,.6,{vol:vol*.25});tone(musicBus,f*3.01,t,.25,{vol:vol*.08})}
function padChord(notes,t,dur){
  const lp=AC.createBiquadFilter();lp.type="lowpass";lp.frequency.value=900;lp.connect(musicBus);
  for(const n of notes){const o=AC.createOscillator(),g=AC.createGain();o.type="triangle";o.frequency.value=hz(n);o.detune.value=(Math.random()-.5)*8;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.035,t+1.2);g.gain.setValueAtTime(.035,t+dur-.6);g.gain.linearRampToValueAtTime(0,t+dur+.8);
    o.connect(g);g.connect(lp);o.start(t);o.stop(t+dur+1)}
}
// Fa maggiore: Fmaj7 – Rem7 – Sib maj7 – Do (sus) ; melodia pentatonica da carillon
const CHORDS=[[-12,-8,-5,-1],[-15,-12,-8,-5],[-19,-15,-12,-8],[-17,-14,-10,-7]];
const BASS=[-24,-27,-31,-29];
const MEL=[
 [[16,null,12,null,9,7,null,null],[14,null,12,null,9,null,12,null],[12,null,16,null,14,12,null,9],[7,null,9,null,14,null,null,null]],
 [[12,null,null,16,19,null,16,null],[14,null,12,9,null,null,7,null],[9,null,12,null,16,null,14,null],[12,null,null,null,null,null,null,null]]];
const EIGHTH=60/72/2;
function scheduler(){
  while(nextT<AC.currentTime+.4){
    const bar=Math.floor(step/8)%4,pos=step%8,phrase=Math.floor(step/32)%2;
    if(pos===0){padChord(CHORDS[bar],nextT,EIGHTH*8);tone(musicBus,hz(BASS[bar]),nextT,2.2,{vol:.07,att:.08})}
    if(pos===4)tone(musicBus,hz(BASS[bar]+7),nextT,1.6,{vol:.04,att:.08});
    const n=MEL[phrase][bar][pos];if(n!==null)musicBox(hz(n),nextT+(Math.random()*.015));
    if(pos%2===1&&Math.random()<.18)musicBox(hz(rnd([19,24,26,28])),nextT,.035);
    nextT+=EIGHTH;step++;
  }
}
function startBGM(){if(!audio())return;AC.resume();if(bgmTimer)return;nextT=AC.currentTime+.1;step=0;
  musicBus.gain.cancelScheduledValues(AC.currentTime);musicBus.gain.setTargetAtTime(.45,AC.currentTime,.6);bgmTimer=setInterval(scheduler,90);scheduler()}
function stopBGM(){if(!AC)return;musicBus.gain.setTargetAtTime(0,AC.currentTime,.25);clearInterval(bgmTimer);bgmTimer=null}
function sfx(kind){
  if(S.muted||!audio())return;AC.resume();const t=AC.currentTime+.01;
  const B=sfxBus;
  if(kind==="tap")tone(B,hz(24),t,.08,{vol:.08,type:"sine"});
  if(kind==="ok"){tone(B,hz(19),t,.5,{vol:.2});tone(B,hz(26),t+.09,.7,{vol:.2});tone(B,hz(31),t+.18,.9,{vol:.12})}
  if(kind==="no"){tone(B,hz(2),t,.25,{vol:.16,type:"triangle"});tone(B,hz(-3),t+.12,.35,{vol:.14,type:"triangle"})}
  if(kind==="combo")[19,23,26,31,35].forEach((n,i)=>tone(B,hz(n),t+i*.05,.4,{vol:.1}));
  if(kind==="level")[12,16,19,24,28,31,36].forEach((n,i)=>tone(B,hz(n),t+i*.07,.6,{vol:.13}));
  if(kind==="stamp"){tone(B,90,t,.18,{vol:.5,type:"sine",att:.002});[24,28,31].forEach((n,i)=>tone(B,hz(n),t+.15+i*.08,.6,{vol:.1}))}
  if(kind==="pop")tone(B,hz(28),t,.12,{vol:.1,type:"triangle"});
  if(kind==="shutter"){tone(B,1800,t,.04,{vol:.12,type:"square"});tone(B,1200,t+.06,.05,{vol:.1,type:"square"})}
}

function makeKanjiQ(){
  const x=weighted(kPool(),y=>mOf(y.k),Q.last);Q.last=x;
  const type=rnd(["mean","mean","read","kanji"]);
  if(type==="mean"){const opts=shuffle([x.mean,...shuffle([...new Set(K.filter(y=>y.k!==x.k).map(y=>y.mean))]).slice(0,3)]);
    return {id:x.k,x,ask:"Cosa significa questo kanji?",show:`<div class="kbig">${x.k}</div>`,opts:opts.map(o=>({v:o,h:esc(o)})),ans:x.mean,cls:""}}
  if(type==="read"){const w=rnd(x.words);
    const others=shuffle([...new Set(ALLW.map(v=>v.r).filter(r=>r!==w.r))]).sort((a,b)=>Math.abs(a.length-w.r.length)-Math.abs(b.length-w.r.length));
    const opts=shuffle([w.r,...shuffle(others.slice(0,8)).slice(0,3)]);
    return {id:x.k,x,w,ask:"Come si legge questa parola?",show:`<div class="kword">${esc(w.w)}</div><div class="hint">${esc(w.m)}</div>`,opts:opts.map(o=>({v:o,h:rb(o)})),ans:w.r,cls:"kana"}}
  const opts=shuffle([x.k,...shuffle(K.filter(y=>y.k!==x.k&&y.mean!==x.mean)).slice(0,3).map(y=>y.k)]);
  const rd=x.kun!=="—"?x.kun:x.on;
  return {id:x.k,x,ask:"Quale kanji significa…",show:`<div class="it">${esc(x.mean)}</div><div class="hint jp">${esc(rd)}${rin(rd)}</div>`,opts:opts.map(o=>({v:o,h:o})),ans:x.k,cls:"kanji"}
}
function makeKanaQ(){
  const p=kanaPool();const x=weighted(p,y=>kmOf(y.id),Q.last);Q.last=x;
  const same=KANA.filter(y=>y.s===x.s&&y.r!==x.r);
  const name=x.s==="h"?"hiragana":"katakana";
  if(Math.random()<.6){const opts=shuffle([x.r,...shuffle([...new Set(same.map(y=>y.r))]).slice(0,3)]);
    return {id:x.id,kx:x,ask:`Come si legge questo ${name}?`,show:`<div class="kbig">${x.c}</div>`,opts:opts.map(o=>({v:o,h:esc(o)})),ans:x.r,cls:""}}
  const pick=[];for(const y of shuffle(same)){if(!pick.some(z=>z.r===y.r))pick.push(y);if(pick.length===3)break}
  const opts=shuffle([x.c,...pick.map(y=>y.c)]);

function nextQ(){

function answer(btn,q){

  if(ok){Q.combo++;Q.correct++;pts=10+Math.min(Q.combo-1,10)*(Q.mode==="lampo"?4:2);Q.score+=pts;addXP(pts);markCorrect();

  else{Q.combo=0;Q.lives--;Q.kind==="kanji"?bump(q.id,-1):kbump(q.id,-1);sfx("no");if(!Q.missed.includes(q.id))Q.missed.push(q.id)}

function setupCanvas(){
  const cv=$("#cv"),pad=$("#pad"),ctx=cv.getContext("2d");let strokes=[],cur=null;
  function size(){const r=pad.getBoundingClientRect(),d=devicePixelRatio||1;cv.width=r.width*d;cv.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);draw()}
  function draw(){const r=pad.getBoundingClientRect();ctx.clearRect(0,0,r.width,r.height);ctx.strokeStyle="#4a5a72";ctx.lineCap="round";ctx.lineJoin="round";ctx.lineWidth=Math.max(7,r.width/32);
    for(const s of strokes.concat(cur?[cur]:[])){ctx.beginPath();s.forEach((p,i)=>{if(!i)ctx.moveTo(p[0],p[1]);else{const q=s[i-1];ctx.quadraticCurveTo(q[0],q[1],(p[0]+q[0])/2,(p[1]+q[1])/2)}});if(s.length===1)ctx.lineTo(s[0][0]+.1,s[0][1]);ctx.stroke()}}
  const pt=e=>{const r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]};
  cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);cur=[pt(e)];draw()};
  cv.onpointermove=e=>{if(!cur)return;cur.push(pt(e));draw()};
  cv.onpointerup=cv.onpointercancel=()=>{if(cur){strokes.push(cur);cur=null;draw()}};
  $("#cl").onclick=()=>{strokes=[];draw()};$("#un").onclick=()=>{strokes.pop();draw()};
  size();new ResizeObserver(size).observe(pad);
}

/* ================= SINCRONIZZAZIONE ================= */
// Ogni dispositivo conta solo i propri punti (S.ctr[id]); unendo si prende il valore più alto per ogni dispositivo,
// così niente viene contato due volte. Le stelline usano la versione più recente.
function b64(u8){let s="";for(let i=0;i<u8.length;i+=8192)s+=String.fromCharCode.apply(null,u8.subarray(i,i+8192));return btoa(s)}
function unb64(s){const bin=atob(s);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u}
async function exportCode(){
  const bytes=new TextEncoder().encode(JSON.stringify({a:"mochi",v:2,ctr:S.ctr,m:S.m,mt:S.mt,km:S.km,kmt:S.kmt,best:S.best}));
  if("CompressionStream" in window){try{const st=new Blob([bytes]).stream().pipeThrough(new CompressionStream("deflate-raw"));return "MKZ."+b64(new Uint8Array(await new Response(st).arrayBuffer()))}catch(e){}}
  return "MK."+b64(bytes);
}
async function importCode(code){
  code=code.replace(/\s+/g,"");const dot=code.indexOf(".");if(dot<0)throw new Error("bad");
  const pre=code.slice(0,dot);let bytes=unb64(code.slice(dot+1));
  if(pre==="MKZ"){if(!("DecompressionStream" in window))throw new Error("old");const st=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));bytes=new Uint8Array(await new Response(st).arrayBuffer())}
  else if(pre!=="MK")throw new Error("bad");
  const o=JSON.parse(new TextDecoder().decode(bytes));if(!o||o.a!=="mochi"||!o.ctr)throw new Error("bad");return o;
}
function mergeIn(o){
  for(const [id,c] of Object.entries(o.ctr)){
    const L=S.ctr[id];if(!L){S.ctr[id]={xp:c.xp||0,correct:c.correct||0,written:c.written||0,days:Object.assign({},c.days||{})};continue}
    L.xp=Math.max(L.xp||0,c.xp||0);L.correct=Math.max(L.correct||0,c.correct||0);L.written=Math.max(L.written||0,c.written||0);
    L.days=L.days||{};for(const [d,n] of Object.entries(c.days||{}))L.days[d]=Math.max(L.days[d]||0,n);
  }
  const pick=(val,ts,oval,ots)=>{for(const [k,v] of Object.entries(oval||{})){const t=(ots&&ots[k])||0;if(t>(ts[k]||0)){val[k]=v;ts[k]=t}}};
  pick(S.m,S.mt,o.m,o.mt);pick(S.km,S.kmt,o.km,o.kmt);
  S.best=Math.max(S.best||0,o.best||0);save();
}

  $("#syncClose").onclick=closeLayer;

    const v=$("#impTxt").value.trim();if(!v){$("#impMsg").textContent="Incolla prima un codice.";return}
    try{const before=XP();const o=await importCode(v);mergeIn(o);hud();sfx("level");
      $("#impMsg").textContent=`Fatto! +${XP()-before} XP dall'altro dispositivo.`;
      setTimeout(()=>{if(screen==="menu")go("menu")},1400)}
    catch(e){sfx("no");$("#impMsg").textContent=e.message==="old"?"Questo browser è troppo vecchio per questo codice: aggiornalo.":"Codice non valido: controlla di averlo copiato tutto."}};
}

/* ================= FOTO RICORDO ================= */
let DL=null;
try{window.claude?.use?.("downloads").then(d=>{DL=d}).catch(()=>{})}catch(e){}
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function cloudShape(ctx,x,y,s){ctx.beginPath();ctx.arc(x,y,30*s,0,7);ctx.arc(x+34*s,y-14*s,38*s,0,7);ctx.arc(x+74*s,y,30*s,0,7);ctx.rect(x,y-2*s,74*s,32*s);ctx.fill()}
async function buildShot(){
  try{await Promise.all(['40px "Mochiy Pop One"','700 40px "Zen Maru Gothic"','600 40px "Klee One"'].map(f=>document.fonts.load(f,"漢字あアabc")))}catch(e){}
  const W=1080,H=1350,c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");
  const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,"#bfe4f9");g.addColorStop(.55,"#e8f5fd");g.addColorStop(1,"#fbf6ee");x.fillStyle=g;x.fillRect(0,0,W,H);
  x.fillStyle="rgba(255,255,255,.85)";cloudShape(x,70,140,1.3);cloudShape(x,820,90,1);cloudShape(x,40,1210,1.1);cloudShape(x,860,1260,1.4);
  const img=new Image();img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(MASCOT);await img.decode().catch(()=>{});
  const fT='"Mochiy Pop One","Zen Maru Gothic",sans-serif',fU='"Zen Maru Gothic",sans-serif',fK='"Klee One",serif';
  // intestazione
  x.fillStyle="#3f7aa6";x.font=`700 34px ${fU}`;x.fillText(new Date().toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long",year:"numeric"}),80,110);
  x.fillStyle="#4a5a72";x.font=`64px ${fT}`;x.fillText("Il mio diario",80,200);x.fillText("di studio",80,280);
  x.fillStyle="#6fb9e3";x.font=`600 38px ${fK}`;x.fillText("かんじ・ひらがな・カタカナ",80,340);
  try{x.drawImage(img,690,140,320,276)}catch(e){}
  // livello
  rr(x,80,390,920,170,40);x.fillStyle="#ffffff";x.fill();
  x.fillStyle="#4a5a72";x.font=`54px ${fT}`;x.fillText(`Livello ${level()}`,130,470);
  x.fillStyle="#3f7aa6";x.font=`700 34px ${fU}`;x.fillText(lvTitle(),130,520);
  x.textAlign="right";x.fillStyle="#c9a978";x.font=`44px ${fT}`;x.fillText(`${XP()} XP`,950,470);x.textAlign="left";
  rr(x,560,500,390,22,11);x.fillStyle="#e1f0fa";x.fill();rr(x,560,500,Math.max(22,390*(XP()%200)/200),22,11);x.fillStyle="#e5ad55";x.fill();
  // statistiche
  const tiles=[[`${kanjiLearned()}`,`kanji su ${K.length}`],[`${kanaLearned("h")}`,`hiragana su ${kanaTotal("h")}`],[`${kanaLearned("k")}`,`katakana su ${kanaTotal("k")}`],
    [`${DAYS()[today()]||0}`,"giuste oggi"],[`${streak()}`,"giorni di fila"],[`${S.best}`,"record punti"]];
  tiles.forEach(([v,l],i)=>{const cx=80+(i%3)*310,cy=600+Math.floor(i/3)*200;rr(x,cx,cy,290,176,34);x.fillStyle=i<3?"#ffffff":"#f4ead9";x.fill();
    x.textAlign="center";x.fillStyle=i<3?"#3f7aa6":"#a8875a";x.font=`70px ${fT}`;x.fillText(v,cx+145,cy+100);x.fillStyle="#8796ab";x.font=`700 28px ${fU}`;x.fillText(l,cx+145,cy+148);x.textAlign="left"});
  // kanji più forti
  x.fillStyle="#3f7aa6";x.font=`700 32px ${fU}`;x.fillText("I miei kanji più forti",80,1062);
  const top=K.filter(k=>mOf(k.k)>0).sort((a,b)=>mOf(b.k)-mOf(a.k)||a.i-b.i).slice(0,8);
  if(top.length){top.forEach((k,i)=>{const cx=80+i*100;rr(x,cx,1086,88,88,22);x.fillStyle="#ffffff";x.fill();x.fillStyle="#4a5a72";x.font=`600 58px ${fK}`;x.textAlign="center";x.fillText(k.k,cx+44,1150);x.textAlign="left"})}
  else{x.fillStyle="#8796ab";x.font=`700 30px ${fU}`;x.fillText("Gioca una sfida per riempire il quaderno!",80,1140)}
  // timbro
  const good=(DAYS()[today()]||0)>0;
  x.save();x.translate(900,1180);x.rotate(-.22);x.strokeStyle="#ec8ca0";x.fillStyle="rgba(255,246,248,.92)";x.lineWidth=7;
  x.beginPath();for(let i=0;i<=24;i++){const a=i/24*Math.PI*2,r=i%2?92:104;x.lineTo(Math.cos(a)*r,Math.sin(a)*r)}x.closePath();x.fill();x.stroke();
  x.beginPath();x.arc(0,0,76,0,7);x.lineWidth=3;x.stroke();
  x.fillStyle="#ec8ca0";x.textAlign="center";x.font=`600 ${good?36:38}px ${fK}`;
  if(good){x.fillText("よく",0,-6);x.fillText("できました",0,36)}else{x.fillText("がんばろう",0,14)}x.restore();x.textAlign="left";
  x.fillStyle="#8796ab";x.font=`700 26px ${fU}`;x.fillText("Mochi Kanji",80,1300);
  return c;
}
async function openShot(){
  sfx("shutter");
  openLayer(`<div class="shot"><h2 style="margin-bottom:12px">Foto ricordo</h2><div id="shotBox" class="muted">Sto preparando la foto…</div>
    <div class="row" style="margin-top:14px"><button class="btn" id="saveShot" hidden>Salva immagine</button><button class="btn white" id="closeShot">Chiudi</button></div>
    <p class="muted" id="shotHint" style="margin:10px 0 0"></p></div>`);
  $("#closeShot").onclick=closeLayer;
  const c=await buildShot();if(!$("#shotBox"))return;
  const url=c.toDataURL("image/png");$("#shotBox").innerHTML=`<img src="${url}" alt="Riepilogo dei progressi di studio">`;
  if(DL){const b=$("#saveShot");b.hidden=false;b.onclick=async()=>{
      try{const blob=await new Promise(r=>c.toBlob(r,"image/png"));const res=await DL.save({filename:`diario-kanji-${today()}.png`,data:blob});if(res.status==="saved")toast("Immagine salvata!")}
      catch(e){if(e?.code==="declined")return;if(e?.code==="rate_limited")toast("Un attimo e riprova.");else{b.hidden=true;$("#shotHint").textContent="Qui non si può salvare direttamente: tieni premuta l'immagine per salvarla."}}}}
  else if(!window.claude){const b=$("#saveShot");b.hidden=false;b.onclick=()=>{const a=document.createElement("a");a.href=url;a.download=`diario-kanji-${today()}.png`;document.body.appendChild(a);a.click();a.remove();toast("Immagine salvata!")};$("#shotHint").textContent="Sul telefono puoi anche tenere premuta l'immagine per salvarla."}
  else $("#shotHint").textContent="Tieni premuta l'immagine (o clic destro) per salvarla.";
}

S.muted=true;save();
go("title");
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
